name: Capture bug
description: Report a browser, document, watch-folder, ResourceInbox, or visual capture issue.
title: "[capture] "
labels:
  - capture
body:
  - type: dropdown
    id: capture_path
    attributes:
      label: Capture path
      options:
        - Browser clipper
        - Visual capture / pixelshot
        - Watch folder
        - Opened document
        - ResourceInbox to raw/input
        - Ingest / source page rendering
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: local_status
    attributes:
      label: Local status and settings
      description: Mention Source Capture settings, Full Local Capture Mode, visualCapture settings, and whether pixelshot is installed when relevant.
      placeholder: "sourceCapture.enabled=true, fullLocalCaptureMode=false, visualCapture.enabled=false"
  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      description: List relevant local files such as ResourceInbox row id, raw/input path, source page path, or pixel-captures path. Do not paste private content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste private, sensitive, credential, health, legal, or financial content into this issue.
          required: true
        - label: I confirmed whether this used normal capture or Full Local Capture Mode.
          required: true
