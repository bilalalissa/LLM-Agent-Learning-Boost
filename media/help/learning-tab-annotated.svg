<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Annotated Learning tab</title>
  <desc id="desc">A simplified map of the Learning tab with numbered callouts for vault selection, overview cards, plan actions, learner profile, source capture, and add resource controls.</desc>
  <defs>
    <style>
      .bg { fill: #f4ecd8; }
      .panel { fill: #fffaf0; stroke: #d8c7a3; stroke-width: 2; }
      .soft { fill: #eadfca; stroke: #d8c7a3; stroke-width: 1.5; }
      .field { fill: #fffaf0; stroke: #d8c7a3; stroke-width: 1.5; }
      .text { fill: #2f271f; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #75664f; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #75664f; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #2f271f; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #2f271f; font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tab { fill: #75664f; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .active { fill: #8a5a19; font: 800 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .button { fill: #9a6518; }
      .buttonText { fill: #ffffff; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .callout { fill: #1f5eff; stroke: #ffffff; stroke-width: 3; }
      .calloutText { fill: #ffffff; font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
      .line { stroke: #1f5eff; stroke-width: 3; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="860"/>
  <rect class="panel" x="28" y="32" width="1224" height="790" rx="8"/>
  <text class="heading" x="58" y="76">LLM Agent Learning Boost</text>
  <text class="tab" x="58" y="120">Chat</text>
  <text class="tab" x="126" y="120">Local</text>
  <text class="tab" x="194" y="120">Files</text>
  <text class="tab" x="262" y="120">Archive</text>
  <text class="tab" x="352" y="120">Topics</text>
  <text class="active" x="438" y="120">Learning</text>
  <rect class="button" x="438" y="134" width="78" height="4" rx="2"/>
  <text class="tab" x="548" y="120">Provider</text>
  <text class="tab" x="658" y="120">Notes</text>

  <text class="muted" x="58" y="176">Local profile, onboarding, and working-memory settings for the selected vault.</text>
