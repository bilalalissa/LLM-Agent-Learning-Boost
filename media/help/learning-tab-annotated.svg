  <rect class="soft" x="994" y="642" width="150" height="30" rx="5"/><text class="small" x="1010" y="662">Screenshots</text>
  <rect class="field" x="666" y="686" width="250" height="30" rx="5"/><text class="small" x="682" y="706">Cloud policy</text>
  <rect class="field" x="934" y="686" width="210" height="30" rx="5"/><text class="small" x="950" y="706">Retention days</text>
  <rect class="button" x="986" y="728" width="158" height="30" rx="5"/><text class="buttonText" x="1065" y="748">Save capture</text>

  <circle class="callout" cx="372" cy="226" r="18"/><text class="calloutText" x="372" y="226">1</text><path class="line" d="M354 226 L244 240"/>
  <circle class="callout" cx="1110" cy="352" r="18"/><text class="calloutText" x="1110" y="352">2</text><path class="line" d="M1090 352 L1000 352"/>
  <circle class="callout" cx="1062" cy="520" r="18"/><text class="calloutText" x="1062" y="520">3</text><path class="line" d="M1042 520 L932 520"/>
  <circle class="callout" cx="560" cy="622" r="18"/><text class="calloutText" x="560" y="622">4</text><path class="line" d="M540 626 L470 642"/>
  <circle class="callout" cx="1144" cy="642" r="18"/><text class="calloutText" x="1144" y="642">5</text><path class="line" d="M1126 642 L1050 642"/>

  <rect class="panel" x="58" y="778" width="1166" height="38" rx="6"/>
  <text class="small" x="76" y="802">Callouts: 1 vault selector, 2 overview cards, 3 plan actions, 4 learner profile, 5 source capture and Add Resource section below the fold.</text>
</svg>
