  <text class="section" x="82" y="622">Learner Profile</text>
  <rect class="field" x="82" y="642" width="230" height="30" rx="5"/><text class="small" x="96" y="662">Profile name</text>
  <rect class="field" x="328" y="642" width="230" height="30" rx="5"/><text class="small" x="342" y="662">Target languages</text>
  <rect class="field" x="82" y="686" width="230" height="30" rx="5"/><text class="small" x="96" y="706">Working memory</text>
  <rect class="field" x="328" y="686" width="230" height="30" rx="5"/><text class="small" x="342" y="706">Coaching style</text>
  <rect class="button" x="418" y="728" width="140" height="30" rx="5"/><text class="buttonText" x="488" y="748">Save profile</text>

  <rect class="panel" x="642" y="586" width="582" height="170" rx="8"/>
